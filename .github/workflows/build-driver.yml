name: Build lsdriver for multiple Android kernels

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: DDK target, or all
        required: false
        default: all

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android12-5.10
            artifact: 5.10-android12.ko
          - target: android13-5.10
            artifact: 5.10-android13.ko
          - target: android13-5.15
            artifact: 5.15-android13.ko
          - target: android14-5.15
            artifact: 5.15-android14.ko
          - target: android14-6.1
            artifact: 6.1.ko
          - target: android15-6.6
            artifact: 6.6.ko
          - target: android16-6.12
            artifact: 6.12-kmi5.ko
          - target: android16-6.12-20251007
            artifact: 6.12-kmi6.ko
          - target: android16-6.12-20260313
            artifact: 6.12-kmi7.ko
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build module
        shell: bash
        working-directory: lsdriver
        run: |
          set -euxo pipefail
          make -j$(nproc) CONFIG_DEBUG_INFO_BTF=n CONFIG_DEBUG_INFO_BTF_MODULES=n CONFIG_MODVERSIONS=n
          if command -v llvm-strip >/dev/null 2>&1; then llvm-strip --strip-unneeded lsdriver.ko || true; fi
          cp lsdriver.ko ../${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30
